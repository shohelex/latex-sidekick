<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{csp}} data:; script-src {{csp}}; style-src 'unsafe-inline'; worker-src {{csp}} blob:; connect-src {{csp}} blob: data:;">
<style>
  body { margin: 0; background: var(--vscode-editor-background); }
  #top { position: sticky; top: 0; z-index: 2; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 4px 8px;
         background: var(--vscode-editorWidget-background); color: var(--vscode-foreground); font: 12px sans-serif; }
  #banner { display: none; padding: 4px 8px; font: 12px sans-serif; background: var(--vscode-inputValidation-warningBackground);
            color: var(--vscode-foreground); border-bottom: 1px solid var(--vscode-inputValidation-warningBorder); }
  #banner[data-kind="busy"] { background: var(--vscode-editorInfo-background, var(--vscode-editorWidget-background));
            border-bottom-color: var(--vscode-editorInfo-foreground); }
  #banner[data-kind="busy"]::before { content: "⟳ "; }
  #issues { display: none; max-height: 40vh; overflow: auto; background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-panel-border); font: 12px sans-serif; color: var(--vscode-foreground); }
  .issue { padding: 5px 8px; cursor: pointer; border-left: 3px solid transparent; }
  .issue:hover { background: var(--vscode-list-hoverBackground); }
  .issue.error { border-left-color: var(--vscode-errorForeground); }
  .issue.warning { border-left-color: var(--vscode-editorWarning-foreground); }
  .issue.info { border-left-color: var(--vscode-editorInfo-foreground); opacity: .85; }
  .issue .msg { font-weight: 600; }
  .issue .loc { color: var(--vscode-descriptionForeground); margin-left: 6px; }
  .issue .hint { color: var(--vscode-descriptionForeground); margin-top: 2px; }
  .issue .ctx { font: 11px var(--vscode-editor-font-family, monospace); margin-top: 2px; white-space: pre-wrap; word-break: break-all;
                background: var(--vscode-textCodeBlock-background); padding: 1px 4px; }
  .issue button.fix { margin-top: 4px; background: var(--vscode-button-background); color: var(--vscode-button-foreground);
                      border: 0; padding: 2px 8px; cursor: pointer; font: 11px sans-serif; }
  #issuesBtn.bad { color: var(--vscode-errorForeground); } #issuesBtn.warn { color: var(--vscode-editorWarning-foreground); }
  #none { padding: 8px; color: var(--vscode-descriptionForeground); }
  #bar .spacer { flex: 1; }
  #bar .bad { color: var(--vscode-errorForeground); } #bar .warn { color: var(--vscode-editorWarning-foreground); }
  #bar button { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);
                border: 0; padding: 2px 8px; cursor: pointer; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  .page { position: relative; }
  .hl { position: absolute; background: rgba(255,214,0,.45); outline: 2px solid rgba(255,170,0,.9); pointer-events: none; }
  canvas { display: block; box-shadow: 0 1px 4px rgba(0,0,0,.5); background: #fff; }
  #empty { color: var(--vscode-descriptionForeground); font: 13px sans-serif; padding: 16px; }
</style>
</head>
<body data-worker="{{worker}}">
  <div id="top">
    <div id="bar">
      <button id="out">−</button><span id="zoom">100%</span><button id="in">+</button>
      <button id="fit">Fit width</button><span id="info"></span>
      <span class="spacer"></span>
      <button id="issuesBtn" title="Show errors and warnings">Issues</button>
      <button id="logBtn" title="Open the full build log">Log</button>
    </div>
    <div id="banner"></div>
    <div id="issues"></div>
  </div>
  <div id="pages"><div id="empty">Save a .tex file (Ctrl+S) to build and see the PDF here. Double-click the PDF to jump to the source.</div></div>
  <script src="{{pdfjs}}"></script>
  <script src="{{script}}"></script>
</body>
</html>
